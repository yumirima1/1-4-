<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>時間割日程タグ ＆ アプリ</title>
  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --neon-color: #ff0055;
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent-color: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ヘッダー＆タグ表示 */
    header {
      padding: 12px 16px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .tag-badge {
      background: #0284c7;
      color: #ffffff;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 0.5px;
    }

    /* 電光掲示板 ＆ 一日おみくじエリア */
    .ticker-wrapper {
      display: flex;
      align-items: center;
      background: #000;
      padding: 8px 12px;
      gap: 10px;
      border-bottom: 2px solid #334155;
    }

    .ticker-container {
      flex: 1;
      overflow: hidden;
      white-space: nowrap;
      position: relative;
      height: 28px;
      display: flex;
      align-items: center;
    }

    .ticker-text {
      display: inline-block;
      white-space: nowrap;
      font-weight: bold;
      font-size: 15px;
      padding-left: 100%;
      animation: marquee 12s linear infinite;
      color: var(--neon-color);
      text-shadow: 0 0 5px var(--neon-color), 0 0 10px var(--neon-color);
    }

    .ticker-text.flicker {
      animation: marquee 12s linear infinite, neonFlicker 1.2s ease-in-out;
    }

    @keyframes marquee {
      0% { transform: translate3d(0, 0, 0); }
      100% { transform: translate3d(-100%, 0, 0); }
    }

    /* 電光掲示板のパチっパチっと滑らかに点灯するリアルなアニメーション */
    @keyframes neonFlicker {
      0% { opacity: 0.1; text-shadow: none; }
      15% { opacity: 0.9; text-shadow: 0 0 8px var(--neon-color); }
      25% { opacity: 0.2; text-shadow: none; }
      35% { opacity: 1; text-shadow: 0 0 12px var(--neon-color), 0 0 20px var(--neon-color); }
      45% { opacity: 0.3; text-shadow: none; }
      60% { opacity: 1; text-shadow: 0 0 10px var(--neon-color); }
      100% { opacity: 1; text-shadow: 0 0 5px var(--neon-color), 0 0 10px var(--neon-color); }
    }

    .omikuji-btn {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 0 2px 6px rgba(245, 158, 11, 0.4);
      transition: transform 0.1s ease, opacity 0.3s ease;
    }

    .omikuji-btn:active {
      transform: scale(0.95);
    }

    .omikuji-btn.hidden {
      display: none !important;
    }

    /* iOS ホーム画面風 滑らかなスライダー */
    .slider-wrapper {
      flex: 1;
      position: relative;
      overflow: hidden;
      width: 100%;
    }

    .slider-track {
      display: flex;
      height: 100%;
      width: 100%;
      will-change: transform;
      transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .slide-page {
      min-width: 100%;
      width: 100%;
      height: 100%;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* インジケーター (iOS風ドット) */
    .pagination-dots {
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 8px 0;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #475569;
      transition: background 0.3s, transform 0.3s;
    }

    .dot.active {
      background: #38bdf8;
      transform: scale(1.25);
    }

    /* カード・枠のデザイン */
    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 16px;
      border: 1px solid #334155;
    }

    .schedule-item {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #334155;
    }

    /* 休日限定 一言コメント（スレッド機能） */
    .thread-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      gap: 10px;
    }

    .thread-messages {
      flex: 1;
      overflow-y: auto;
      background: #0f172a;
      border-radius: 12px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 250px;
    }

    .message-item {
      background: #1e293b;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      border-left: 3px solid var(--accent-color);
    }

    .message-time {
      font-size: 10px;
      color: #94a3b8;
      margin-top: 4px;
    }

    .thread-input-box {
      display: flex;
      gap: 6px;
    }

    .thread-input-box input {
      flex: 1;
      background: #0f172a;
      border: 1px solid #334155;
      color: #fff;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
    }

    .thread-input-box button {
      background: var(--accent-color);
      color: #000;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    /* 設定エリア＆アコーディオン */
    .settings-item {
      border-top: 1px solid #334155;
      padding-top: 12px;
      margin-top: 12px;
    }

    .accordion-header {
      cursor: pointer;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
    }

    .accordion-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease-out;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-top: 4px;
    }

    .accordion-content.open {
      max-height: 300px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .form-group label {
      font-size: 12px;
      color: #94a3b8;
    }

    .form-group input, .form-group textarea {
      background: #0f172a;
      border: 1px solid #334155;
      color: #fff;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 13px;
    }

    .color-picker-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .color-picker-wrapper input[type="color"] {
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      background: none;
    }
  </style>
</head>
<body>

  <!-- ヘッダー -->
  <header>
    <h3>時間割＆共有</h3>
    <span class="tag-badge">時間割日程タグ</span>
  </header>

  <!-- 電光掲示板 ＆ 一日おみくじ -->
  <div class="ticker-wrapper">
    <div class="ticker-container">
      <div id="tickerText" class="ticker-text">本日のメッセージがここに流れます...</div>
    </div>
    <button id="omikujiBtn" class="omikuji-btn" onclick="drawOmikuji()">一日おみくじ</button>
  </div>

  <!-- スライダー領域（iOSホーム画面風） -->
  <div class="slider-wrapper" id="sliderWrapper">
    <div class="slider-track" id="sliderTrack">
      
      <!-- ページ1: 平日時間割 -->
      <div class="slide-page">
        <div class="card">
          <h4>平日時間割</h4>
          <div class="schedule-item"><span>1時限</span><span>数学</span></div>
          <div class="schedule-item"><span>2時限</span><span>英語</span></div>
          <div class="schedule-item"><span>3時限</span><span>理科</span></div>
          <div class="schedule-item"><span>4時限</span><span>社会</span></div>
        </div>
      </div>

      <!-- ページ2: 休日限定共有スレッド（安全設計付き） -->
      <div class="slide-page">
        <div class="card thread-container">
          <h4>休日限定 一言コメント</h4>
          <div class="thread-messages" id="threadMessages">
            <div class="message-item">読み込み中...</div>
          </div>
          <div class="thread-input-box">
            <input type="text" id="commentInput" placeholder="一言コメントを入力..." maxlength="100">
            <button onclick="postComment()">送信</button>
          </div>
        </div>
      </div>

      <!-- ページ3: 設定 -->
      <div class="slide-page">
        <div class="card">
          <h4>設定</h4>
          <p style="font-size: 13px; color: #94a3b8; margin-bottom: 12px;">各種設定を行えます。</p>

          <!-- 設定の一番下：おみくじ編集アコーディオン -->
          <div class="settings-item">
            <div class="accordion-header" onclick="toggleAccordion()">
              <span>おみくじ設定・編集</span>
              <span id="accIcon">▼</span>
            </div>
            <div id="accordionContent" class="accordion-content">
              <div class="form-group">
                <label>おみくじ結果リスト (カンマ区切り)</label>
                <textarea id="omikujiListInput" rows="3">大吉！最高の一日になります, 吉！良いことがあります, 中吉！穏やかに過ごせます, 小吉！ラッキーなことがあるかも</textarea>
              </div>
              <div class="form-group">
                <label>電光掲示板の発光色</label>
                <div class="color-picker-wrapper">
                  <input type="color" id="neonColorInput" value="#ff0055" onchange="updateNeonColor(this.value)">
                  <span id="colorCodeText">#ff0055</span>
                </div>
              </div>
              <button onclick="saveSettings()" style="background: #22c55e; color: #fff; border: none; padding: 6px; border-radius: 6px; font-weight: bold; cursor: pointer;">設定を保存</button>
            </div>
          </div>

        </div>
      </div>

    </div>
  </div>

  <!-- iOS風 ページインジケーター -->
  <div class="pagination-dots">
    <div class="dot active"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>

  <script>
    // ==========================================
    // 1. Supabase 設定 (ご自身の情報に置き換えてください)
    // ==========================================
    const SUPABASE_URL = 'https://your-supabase-url.supabase.co';
    const SUPABASE_KEY = 'your-anon-key';
    const supabase = (SUPABASE_URL.includes('your-supabase-url')) 
      ? null 
      : window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // ==========================================
    // 2. iOS風 スライド・ジェスチャー処理
    // ==========================================
    const track = document.getElementById('sliderTrack');
    const dots = document.querySelectorAll('.dot');
    let currentIndex = 0;
    let startX = 0;
    let currentTranslate = 0;
    let prevTranslate = 0;
    let isDragging = false;

    track.addEventListener('touchstart', touchStart);
    track.addEventListener('touchmove', touchMove);
    track.addEventListener('touchend', touchEnd);

    track.addEventListener('mousedown', touchStart);
    track.addEventListener('mousemove', touchMove);
    track.addEventListener('mouseup', touchEnd);
    track.addEventListener('mouseleave', () => isDragging && touchEnd());

    function touchStart(e) {
      isDragging = true;
      startX = getPositionX(e);
      track.style.transition = 'none';
    }

    function touchMove(e) {
      if (!isDragging) return;
      const currentX = getPositionX(e);
      const diff = currentX - startX;
      currentTranslate = prevTranslate + diff;
      track.style.transform = `translate3d(${currentTranslate}px, 0, 0)`;
    }

    function touchEnd() {
      if (!isDragging) return;
      isDragging = false;
      const movedBy = currentTranslate - prevTranslate;

      // 半分以上または勢いよく動かしたらページ切り替え（バウンス＆スナップ）
      if (movedBy < -80 && currentIndex < 2) currentIndex++;
      else if (movedBy > 80 && currentIndex > 0) currentIndex--;

      setPositionByIndex();
    }

    function getPositionX(e) {
      return e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
    }

    function setPositionByIndex() {
      const width = track.clientWidth;
      currentTranslate = currentIndex * -width;
      prevTranslate = currentTranslate;
      track.style.transition = 'transform 0.35s cubic-bezier(0.25, 1, 0.5, 1)';
      track.style.transform = `translate3d(${currentTranslate}px, 0, 0)`;

      dots.forEach((dot, idx) => {
        dot.classList.toggle('active', idx === currentIndex);
      });
    }

    window.addEventListener('resize', setPositionByIndex);

    // ==========================================
    // 3. 一日おみくじ ＆ 電光掲示板 処理
    // ==========================================
    let omikujiItems = [
      "大吉！最高の一日になります",
      "吉！良いことがあります",
      "中吉！穏やかに過ごせます",
      "小吉！ラッキーなことがあるかも"
    ];

    function initOmikuji() {
      const savedColor = localStorage.getItem('omikuji_color') || '#ff0055';
      updateNeonColor(savedColor);
      document.getElementById('neonColorInput').value = savedColor;

      const savedList = localStorage.getItem('omikuji_list');
      if (savedList) {
        omikujiItems = savedList.split(',').map(s => s.trim());
        document.getElementById('omikujiListInput').value = savedList;
      }

      // 判定: 本日すでにおみくじを引いているか
      const today = new Date().toISOString().split('T')[0];
      const lastDrawn = localStorage.getItem('omikuji_last_drawn');
      const savedResult = localStorage.getItem('omikuji_last_result');

      if (lastDrawn === today && savedResult) {
        document.getElementById('omikujiBtn').classList.add('hidden');
        setTickerText(savedResult, false);
      }
    }

    function drawOmikuji() {
      const today = new Date().toISOString().split('T')[0];
      const result = omikujiItems[Math.floor(Math.random() * omikujiItems.length)];

      localStorage.setItem('omikuji_last_drawn', today);
      localStorage.setItem('omikuji_last_result', result);

      // ボタンを完全に削除・隠す
      document.getElementById('omikujiBtn').classList.add('hidden');

      // 電光掲示板に結果を流し、パチっパチっと滑らかに点灯させる
      setTickerText(result, true);
    }

    function setTickerText(text, triggerFlicker) {
      const ticker = document.getElementById('tickerText');
      ticker.textContent = text;
      
      if (triggerFlicker) {
        ticker.classList.remove('flicker');
        void ticker.offsetWidth; // リフロー発生
        ticker.classList.add('flicker');
      }
    }

    function updateNeonColor(color) {
      document.documentElement.style.setProperty('--neon-color', color);
      document.getElementById('colorCodeText').textContent = color;
    }

    // ==========================================
    // 4. 設定アコーディオン 処理
    // ==========================================
    function toggleAccordion() {
      const content = document.getElementById('accordionContent');
      const icon = document.getElementById('accIcon');
      const isOpen = content.classList.contains('open');

      if (isOpen) {
        content.classList.remove('open');
        icon.textContent = '▼';
      } else {
        content.classList.add('open');
        icon.textContent = '▲';
      }
    }

    function saveSettings() {
      const color = document.getElementById('neonColorInput').value;
      const listText = document.getElementById('omikujiListInput').value;

      localStorage.setItem('omikuji_color', color);
      localStorage.setItem('omikuji_list', listText);
      omikujiItems = listText.split(',').map(s => s.trim());

      alert('設定を保存しました。');
    }

    // ==========================================
    // 5. 安全設計対応 Supabase スレッド機能
    // ==========================================
    async function loadComments() {
      const container = document.getElementById('threadMessages');
      if (!supabase) {
        container.innerHTML = '<div class="message-item">SupabaseのURLとKEYを設定してください。</div>';
        return;
      }

      // 安全策: 最新20件のみ取得（転送量を最小化）
      const { data, error } = await supabase
        .from('holiday_comments')
        .select('*')
        .order('created_at', { ascending: false })
        .limit(20);

      if (error) {
        container.innerHTML = '<div class="message-item">取得エラーが発生しました。</div>';
        return;
      }

      if (data.length === 0) {
        container.innerHTML = '<div class="message-item">コメントはまだありません。</div>';
        return;
      }

      container.innerHTML = data.reverse().map(msg => `
        <div class="message-item">
          <div>${escapeHTML(msg.content)}</div>
          <div class="message-time">${new Date(msg.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</div>
        </div>
      `).join('');

      container.scrollTop = container.scrollHeight;
    }

    async function postComment() {
      const input = document.getElementById('commentInput');
      const text = input.value.trim();
      if (!text) return;

      if (!supabase) {
        alert('Supabaseが未設定です。');
        return;
      }

      input.value = '';

      const { error } = await supabase
        .from('holiday_comments')
        .insert([{ content: text }]);

      if (error) {
        alert('投稿に失敗しました。');
      } else {
        loadComments();
      }
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    // 初期化実行
    window.addEventListener('DOMContentLoaded', () => {
      initOmikuji();
      loadComments();
    });
  </script>
</body>
</html>
