<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1-4 案内箱</title>
  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-color: #fbfbfd;
      --card-bg: rgba(255, 255, 255, 0.88);
      --text-color: #1d1d1f;
      --accent-color: #0071e3;
      --danger-color: #ff3b30;
      --neon-color: #ff2d55;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Roboto, sans-serif; }
    
    body {
      background-color: var(--bg-color);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: var(--text-color);
      min-height: 100vh;
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-bottom: 40px;
    }

    /* --- UIカード基本デザイン --- */
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.06);
      border: 1px solid rgba(255,255,255,0.4);
      transition: all 0.3s ease;
    }

    .hidden { display: none !important; }

    .btn {
      background: var(--accent-color);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 10px 16px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.2s ease, background-color 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .btn:active { transform: scale(0.96); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .input, .select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(0,0,0,0.15);
      background: rgba(255,255,255,0.9);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .input:focus, .select:focus { border-color: var(--accent-color); }

    /* --- ヘッダー & 電光掲示板 --- */
    .header-bar { display: flex; justify-content: space-between; align-items: center; }
    .header-title { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; }

    .ticker-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(0,0,0,0.04);
      padding: 8px 12px;
      border-radius: 14px;
      overflow: hidden;
    }
    .ticker-content { flex: 1; overflow: hidden; white-space: nowrap; }
    .ticker-text {
      display: inline-block;
      animation: ticker 14s linear infinite;
      font-size: 14px;
      font-weight: 600;
    }
    @keyframes ticker {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }

    /* --- パチッパチッ滑らかなネオン点滅演出 --- */
    .neon-text {
      display: inline-block;
      color: var(--neon-color);
      font-weight: 700;
      animation: neonFlicker 1.8s ease-in-out forwards;
    }
    @keyframes neonFlicker {
      0% { opacity: 0; text-shadow: none; }
      10% { opacity: 0.9; text-shadow: 0 0 6px var(--neon-color); }
      14% { opacity: 0.1; text-shadow: none; }
      22% { opacity: 1; text-shadow: 0 0 10px var(--neon-color); }
      32% { opacity: 0.2; text-shadow: none; }
      50% { opacity: 1; text-shadow: 0 0 12px var(--neon-color), 0 0 22px var(--neon-color); }
      58% { opacity: 0.6; text-shadow: 0 0 6px var(--neon-color); }
      100% { opacity: 1; text-shadow: 0 0 8px var(--neon-color), 0 0 18px var(--neon-color), 0 0 28px var(--neon-color); }
    }

    /* 一日おみくじ（小型ボタン） */
    .omikuji-mini-btn {
      background: linear-gradient(135deg, #ff9500, #ff2d55);
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(255,45,85,0.3);
      transition: transform 0.15s ease;
    }
    .omikuji-mini-btn:active { transform: scale(0.92); }

    /* --- 時間割 & iOS風滑らかスライド --- */
    .sched-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .sched-slider-outer { overflow: hidden; width: 100%; position: relative; touch-action: pan-y; }
    .sched-slider-inner {
      display: flex;
      width: 100%;
      transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform;
    }
    .sched-slide { flex: 0 0 100%; width: 100%; }

    .slot-row {
      display: flex;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid rgba(0,0,0,0.06);
      gap: 12px;
    }
    .slot-row:last-child { border-bottom: none; }
    .slot-row.empty { opacity: 0.5; }
    .slot-num { font-weight: 700; width: 38px; font-size: 14px; color: var(--accent-color); }
    .slot-subject { font-weight: 600; width: 95px; font-size: 15px; }
    .slot-detail { font-size: 13px; color: #666; flex: 1; word-break: break-word; }

    /* --- 休日限定：みんなの一言スレッド --- */
    .thread-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 260px;
      overflow-y: auto;
      padding: 4px;
      margin-top: 6px;
    }
    .thread-item {
      background: rgba(255,255,255,0.95);
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 13px;
      border-left: 3px solid var(--accent-color);
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }
    .thread-time { font-size: 10px; color: #888; margin-top: 3px; text-align: right; }
    .thread-form { display: flex; gap: 8px; margin-top: 10px; }

    /* --- カウントダウン / インスタ風スライド --- */
    .insta-slide-item { text-align: center; padding: 10px 0; }
    .countdown-title { font-size: 15px; font-weight: 700; color: #444; }
    .countdown-days-wrap { margin-top: 4px; display: flex; align-items: baseline; justify-content: center; gap: 4px; }
    .countdown-num { font-size: 32px; font-weight: 800; color: var(--accent-color); }
    .countdown-label { font-size: 14px; font-weight: 600; }

    .dots-wrap { display: flex; justify-content: center; gap: 6px; margin-top: 10px; }
    .insta-dot { width: 6px; height: 6px; border-radius: 50%; background: #ccc; transition: all 0.25s; cursor: pointer; }
    .insta-dot.active { width: 18px; border-radius: 4px; background: var(--accent-color); }

    /* --- 提出物表示 --- */
    .submission-row { padding: 8px 0; border-bottom: 1px solid rgba(0,0,0,0.05); }
    .submission-row:last-child { border-bottom: none; }
    .submission-title { font-weight: 700; font-size: 14px; }
    .submission-date { font-size: 12px; color: var(--danger-color); font-weight: 600; margin-top: 2px; }
    .submission-detail { font-size: 12px; color: #666; margin-top: 2px; }

    /* --- 外部リンクボタン --- */
    .compact-link-btn {
      background: rgba(255,255,255,0.9);
      border: 1px solid rgba(0,0,0,0.1);
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
      transition: all 0.2s;
    }
    .compact-link-btn:active { transform: scale(0.95); background: #eee; }

    /* --- 設定画面 & アコーディオンUI --- */
    .settings-section { margin-bottom: 20px; }
    .section-title { font-size: 14px; font-weight: 700; color: #666; margin-bottom: 8px; }
    .edit-item-row { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
    .del-btn { background: var(--danger-color); color: white; border: none; border-radius: 8px; padding: 6px 10px; font-size: 12px; cursor: pointer; }
    
    .accordion-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0,0,0,0.04);
      padding: 12px 16px;
      border-radius: 14px;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
      transition: background 0.2s;
    }
    .accordion-header:hover { background: rgba(0,0,0,0.07); }

    .date-chip-bar { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 12px; }
    .date-chip { padding: 6px 12px; border-radius: 20px; background: #eee; font-size: 12px; font-weight: 600; white-space: nowrap; cursor: pointer; }
    .date-chip.selected { background: var(--accent-color); color: white; }

    .tag-chip-item { padding: 6px 12px; border-radius: 12px; background: #f0f0f0; font-size: 13px; cursor: pointer; margin-right: 6px; margin-bottom: 6px; display: inline-block; }
    .tag-chip-item.active { background: var(--accent-color); color: white; }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- ==================== メインホームビュー ==================== -->
    <div id="home-view">
      <!-- ヘッダー -->
      <div class="card header-bar">
        <div>
          <div id="header-custom-display" class="header-title"></div>
          <div id="weather" style="font-size: 12px; color: #666; margin-top: 2px;"></div>
        </div>
        <button class="btn" onclick="openAuthModal()" style="padding: 6px 12px; font-size: 12px;">設定</button>
      </div>

      <!-- 電光掲示板 ＆ 一日おみくじボタン -->
      <div class="card ticker-wrapper" style="margin-top: 12px;">
        <div class="ticker-content">
          <span id="ticker-text" class="ticker-text"></span>
        </div>
        <button id="omikuji-mini-btn" class="omikuji-mini-btn" onclick="drawOmikuji()">🎲 一日おみくじ</button>
      </div>

      <!-- バナーカード -->
      <div id="banner-card" class="card hidden" style="margin-top: 12px; padding: 0; overflow: hidden;">
        <img id="banner-img" src="" alt="バナー" style="width: 100%; display: block;">
      </div>

      <!-- 時間割スライド表示 -->
      <div class="card" style="margin-top: 12px;">
        <div class="sched-nav">
          <button id="sched-prev-btn" class="btn" style="padding: 4px 10px; font-size: 12px;" onclick="prevHomeOffset()">◀</button>
          <div style="text-align: center;">
            <div id="schedule-target-label" style="font-weight: 700; font-size: 15px;"></div>
            <div id="schedule-tag-label-head" style="font-size: 11px; color: var(--accent-color); font-weight: 600;" class="hidden"></div>
          </div>
          <button id="sched-next-btn" class="btn" style="padding: 4px 10px; font-size: 12px;" onclick="nextHomeOffset()">▶</button>
        </div>

        <div id="sched-slider-outer" class="sched-slider-outer">
          <div id="sched-slider-inner" class="sched-slider-inner">
            <div id="schedule-list-container" class="sched-slide"></div>
          </div>
        </div>

        <div id="sched-dots-container" class="dots-wrap"></div>
      </div>

      <!-- 休日限定楽曲カード (設定で登録されている場合のみ) -->
      <div id="holiday-song-card" class="card hidden" style="margin-top: 12px;">
        <div class="section-title">🎵 休日のおすすめ楽曲</div>
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <div>
            <div id="song-display-title" style="font-weight: 700; font-size: 14px;"></div>
            <div id="song-display-artist" style="font-size: 12px; color: #666;"></div>
          </div>
          <a id="song-display-link" href="#" target="_blank" class="btn" style="padding: 6px 12px; font-size: 12px; text-decoration: none;">聴く</a>
        </div>
      </div>

      <!-- 提出物 (明日締め切り緊急枠) -->
      <div id="urgent-submission-card" class="card hidden" style="margin-top: 12px; border: 1.5px solid var(--danger-color);">
        <div class="section-title" style="color: var(--danger-color);">⚠️ 明日締切の提出物</div>
        <div id="urgent-submission-list"></div>
      </div>

      <!-- カウントダウン -->
      <div id="countdown-card" class="card hidden" style="margin-top: 12px;">
        <div id="countdown-slide-wrap"></div>
        <div id="countdown-insta-nav" class="dots-wrap">
          <button id="cd-prev-btn" onclick="prevCdSlide()" style="display:none;"></button>
          <div id="cd-dots-container" class="dots-wrap"></div>
          <button id="cd-next-btn" onclick="nextCdSlide()" style="display:none;"></button>
        </div>
      </div>

      <!-- 提出物一覧 -->
      <div id="submissions-card" class="card hidden" style="margin-top: 12px;">
        <div class="section-title">📝 提出物一覧</div>
        <div id="submissions-list-container"></div>
      </div>

      <!-- 外部リンク -->
      <div id="home-links" style="display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px;"></div>
    </div>

    <!-- ==================== 設定ビュー ==================== -->
    <div id="settings-view" class="card hidden">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h2 style="font-size: 18px;">⚙️ 設定</h2>
        <button class="btn" onclick="showHome()">完了</button>
      </div>

      <!-- 基本デザイン・テキスト -->
      <div class="settings-section">
        <div class="section-title">基本設定</div>
        <input type="password" id="cfg-password" class="input" placeholder="管理パスワード変更 (任意)" style="margin-bottom: 8px;">
        <input type="text" id="cfg-header-text" class="input" placeholder="ヘッダータイトル" style="margin-bottom: 8px;">
        <input type="color" id="cfg-bg-color" class="input" style="height: 40px; margin-bottom: 8px;" onchange="applyStylesAndText()">
        <input type="text" id="cfg-notice" class="input" placeholder="電光掲示板のお知らせ" style="margin-bottom: 8px;">
      </div>

      <!-- 背景・バナー画像設定 -->
      <div class="settings-section">
        <div class="section-title">画像カスタマイズ</div>
        <label style="font-size: 12px; color: #666;">背景画像:</label>
        <div style="display: flex; gap: 6px; margin-bottom: 8px;">
          <input type="file" id="cfg-bg-file" accept="image/*" class="input" onchange="handleFileSelect(event)">
          <button class="del-btn" onclick="clearBgImage()">削除</button>
        </div>
        <label style="font-size: 12px; color: #666;">バナー画像:</label>
        <div style="display: flex; gap: 6px;">
          <input type="file" id="cfg-banner-file" accept="image/*" class="input" onchange="handleBannerFileSelect(event)">
          <button class="del-btn" onclick="clearBannerImage()">削除</button>
        </div>
      </div>

      <!-- 休日楽曲設定 -->
      <div class="settings-section">
        <div class="section-title">🎵 休日のおすすめ楽曲設定</div>
        <input type="text" id="cfg-song-title" class="input" placeholder="曲名" style="margin-bottom: 6px;">
        <input type="text" id="cfg-song-artist" class="input" placeholder="アーティスト名" style="margin-bottom: 6px;">
        <input type="text" id="cfg-song-url" class="input" placeholder="楽曲URL (YouTubeなど)">
      </div>

      <!-- 時間割日程タグ ＆ 時間割編集 -->
      <div class="settings-section">
        <div class="section-title">時間割日程タグ編集</div>
        <div id="date-select-bar" class="date-chip-bar"></div>
        <div style="margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;">
          <span id="current-tag-text" style="font-size: 13px; font-weight: 600;"></span>
          <button class="btn" style="padding: 4px 10px; font-size: 11px;" onclick="openTagModal()">タグ変更</button>
        </div>
        <div id="schedule-editor"></div>
      </div>

      <!-- カウントダウン管理 -->
      <div class="settings-section">
        <div class="section-title">⏳ カウントダウン管理</div>
        <div id="event-editor-list"></div>
        <button class="btn" style="width: 100%; margin-top: 6px;" onclick="addEventItem()">+ 追加</button>
      </div>

      <!-- 提出物管理（月・日ドロップダウン） -->
      <div class="settings-section">
        <div class="section-title">📝 提出物管理</div>
        <div id="submission-editor-list"></div>
        <button class="btn" style="width: 100%; margin-top: 6px;" onclick="addSubmissionItem()">+ 追加</button>
      </div>

      <!-- 外部リンク管理 -->
      <div class="settings-section">
        <div class="section-title">🔗 外部リンク管理</div>
        <div id="link-editor-list"></div>
        <button class="btn" style="width: 100%; margin-top: 6px;" onclick="addLinkItem()">+ 追加</button>
      </div>

      <!-- 🎲 おみくじ設定（一番下・アコーディオン展開） -->
      <div class="settings-section" style="margin-top: 24px;">
        <div class="accordion-header" onclick="toggleOmikujiAccordion()">
          <span>🎲 おみくじ設定</span>
          <span id="omi-accordion-icon">▼</span>
        </div>
        <div id="omikuji-accordion-content" class="hidden" style="margin-top: 12px;">
          <div id="omikuji-editor-list"></div>
          <button class="btn" style="width: 100%; margin-top: 6px;" onclick="addOmikujiItem()">+ おみくじ項目を追加</button>
        </div>
      </div>
    </div>
  </div>

  <!-- パスワードモーダル -->
  <div id="auth-modal" class="card hidden" style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90%; max-width: 320px; z-index: 100; box-shadow: 0 10px 40px rgba(0,0,0,0.3);">
    <div style="font-weight: 700; margin-bottom: 8px;">パスワード入力</div>
    <input type="password" id="pwd-input" class="input" style="margin-bottom: 12px;">
    <div style="display: flex; gap: 8px; justify-content: flex-end;">
      <button class="btn" style="background: #ccc;" onclick="closeAuthModal()">キャンセル</button>
      <button class="btn" onclick="verifyPassword()">解除</button>
    </div>
  </div>

  <!-- 時間割日程タグ選択モーダル -->
  <div id="tag-modal" class="card hidden" style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90%; max-width: 360px; z-index: 100; box-shadow: 0 10px 40px rgba(0,0,0,0.3);">
    <div style="font-weight: 700; margin-bottom: 12px;">時間割日程タグの選択</div>
    <div id="tag-list-chips" style="margin-bottom: 12px;"></div>
    <input type="text" id="new-tag-input" class="input" placeholder="新しいタグ名（例: 行事）" style="margin-bottom: 8px;">
    <button class="btn" style="width: 100%; margin-bottom: 12px;" onclick="addNewTag()">タグを追加して適用</button>
    <button class="btn" style="width: 100%; background: #ccc;" onclick="closeTagModal()">閉じる</button>
  </div>

  <script>
    // --- マスター認証・Supabase連携 ---
    const _0x9b = 'admin123';
    let SUPABASE_URL = '';
    let SUPABASE_KEY = '';
    let supabaseClient = null;

    if (SUPABASE_URL && SUPABASE_KEY && window.supabase) {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    }

    // --- アプリデータ構造 ---
    let portalData = { headerText: 'クラスポータル', notice: '連絡事項はありません', bgColor: '#fbfbfd', customPassword: '' };
    let scheduleData = {};
    let eventsData = [];
    let submissionsData = [];
    let linksData = [];
    let customTags = ['通常', '45分日課', '行事', '休み'];
    let holidaySong = { title: '', artist: '', url: '' };
    let omikujiList = [
      { rarity: '🌸 大吉', title: '小テスト満点！', desc: '最高の1日になります', color: '#ff2d55' },
      { rarity: '☀️ 吉', title: '提出物バッチリ', desc: '良いことがあります', color: '#ff9500' },
      { rarity: '🍀 幸運', title: 'ラッキーデイ', desc: '友達と楽しく過ごせそう', color: '#34c759' }
    ];

    let selectedImageBase64 = '';
    let selectedBannerBase64 = '';
    let currentHomeOffset = (new Date().getHours() >= 18) ? 1 : 0;
    let selectedEditDateKey = '';
    let currentCdIndex = 0;
    let lastThreadPostTime = 0;

    // --- 日付ユーティリティ ---
    function getDateObj(offset) { const d = new Date(); d.setDate(d.getDate() + offset); return d; }
    function formatDateKey(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
    function formatDateLabel(d, offset) {
      const days = ['日', '月', '火', '水', '木', '金', '土'];
      const prefix = offset === 0 ? '本日' : offset === 1 ? '明日' : `${d.getMonth() + 1}/${d.getDate()}`;
      return `${prefix} (${days[d.getDay()]})`;
    }

    // --- 時間割 ＆ 休日スレッド描画 ---
    function renderHomeSchedule() {
      const targetDate = getDateObj(currentHomeOffset);
      const key = formatDateKey(targetDate);
      const dayData = scheduleData[key] || {};
      const currentTag = dayData.tag || '';

      document.getElementById('schedule-target-label').textContent = formatDateLabel(targetDate, currentHomeOffset);
      const tagLabelHead = document.getElementById('schedule-tag-label-head');
      
      if (currentTag) {
        tagLabelHead.textContent = `時間割日程タグ: #${currentTag}`;
        tagLabelHead.classList.remove('hidden');
      } else {
        tagLabelHead.classList.add('hidden');
      }

      const container = document.getElementById('schedule-list-container');
      container.innerHTML = '';

      // 休日タグの場合は時間割枠を「みんなの一言スレッド」に切り替え
      if (currentTag === '休み') {
        const threadBox = document.createElement('div');
        threadBox.innerHTML = `
          <div style="font-weight: 700; font-size: 14px; margin-bottom: 8px; color: var(--accent-color);">💬 休日の一言スレッド</div>
          <div id="thread-list-${key}" class="thread-container">読み込み中...</div>
          <div class="thread-form">

    // --- Supabase安全機構付きスレッド機能 ---
    async function loadThreadComments(dateKey) {
      const container = document.getElementById(`thread-list-${dateKey}`);
      if (!container) return;

      if (supabaseClient) {
        // 安全機構: 最新50件のみ取得
        const { data, error } = await supabaseClient
          .from('threads')
          .select('*')
          .eq('date_key', dateKey)
          .order('created_at', { ascending: true })
          .limit(50);

        if (!error && data) {
          renderThreadItems(container, data);
          return;
        }
      }
      const localData = JSON.parse(localStorage.getItem(`threads_${dateKey}`) || '[]');
      renderThreadItems(container, localData);
    }

    function renderThreadItems(container, items) {
      if (items.length === 0) {
        container.innerHTML = '<div style="color:#999; font-size:12px; text-align:center; padding:16px;">まだ投稿はありません</div>';
        return;
      }
      container.innerHTML = items.map(item => `
        <div class="thread-item">
          <div>${escapeHTML(item.text)}</div>
          <div class="thread-time">${new Date(item.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</div>
        </div>
      `).join('');
      container.scrollTop = container.scrollHeight;
    }

    async function postThreadComment(dateKey) {
      const input = document.getElementById(`thread-input-${dateKey}`);
      if (!input) return;
      const val = input.value.trim();
      if (!val) return;

      // 安全機構 1: 連投ガード (5秒間)
      const now = Date.now();
      if (now - lastThreadPostTime < 5000) {
        alert('連続投稿は少し時間を置いてから行ってください。');
        return;
      }
      lastThreadPostTime = now;

      // 安全機構 2: 文字数制限100文字
      const cleanText = val.slice(0, 100);
      const newComment = { date_key: dateKey, text: cleanText, created_at: new Date().toISOString() };

      if (supabaseClient) {
        await supabaseClient.from('threads').insert([newComment]);
      } else {
        const localData = JSON.parse(localStorage.getItem(`threads_${dateKey}`) || '[]');
        localData.push(newComment);
        if (localData.length > 50) localData.shift(); // 安全機構 3: 50件超過を削除
        localStorage.setItem(`threads_${dateKey}`, JSON.stringify(localData));
      }

      input.value = '';
      loadThreadComments(dateKey);
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
    }

    // --- 画像圧縮ロジック ---
    function compressImage(file, callback) {
      const reader = new FileReader();
      reader.onload = function(evt) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const maxDim = 1024;
          let w = img.width, h = img.height;
          if (w > h && w > maxDim) { h = Math.round((h * maxDim) / w); w = maxDim; }
          else if (h > maxDim) { w = Math.round((w * maxDim) / h); h = maxDim; }
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          callback(canvas.toDataURL('image/jpeg', 0.7));
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    }

    function handleFileSelect(e) { if (e.target.files[0]) compressImage(e.target.files[0], res => { selectedImageBase64 = res; applyStylesAndText(); }); }
    function clearBgImage() { selectedImageBase64 = ''; document.getElementById('cfg-bg-file').value = ''; applyStylesAndText(); }

    function handleBannerFileSelect(e) { if (e.target.files[0]) compressImage(e.target.files[0], res => { selectedBannerBase64 = res; applyStylesAndText(); }); }

    }

    // --- タグモーダル ---
    function openTagModal() { renderTagChips(); document.getElementById('tag-modal').classList.remove('hidden'); }
    function closeTagModal() { document.getElementById('tag-modal').classList.add('hidden'); }

    function renderTagChips() {
      const container = document.getElementById('tag-list-chips'); container.innerHTML = '';
      const currentTag = (scheduleData[selectedEditDateKey] && scheduleData[selectedEditDateKey].tag) || '';

      const noneChip = document.createElement('div');
      noneChip.className = `tag-chip-item ${!currentTag ? 'active' : ''}`;
      noneChip.textContent = '🚫 設定なし';
      noneChip.onclick = () => selectTag('');
      container.appendChild(noneChip);

      customTags.forEach(tag => {
        const chip = document.createElement('div');
        chip.className = `tag-chip-item ${currentTag === tag ? 'active' : ''}`;
        chip.textContent = `#${tag}`;
        chip.onclick = () => selectTag(tag);
        container.appendChild(chip);
      });
    }

    function selectTag(tag) {
      if (!scheduleData[selectedEditDateKey]) scheduleData[selectedEditDateKey] = {};
      scheduleData[selectedEditDateKey].tag = tag;
      renderScheduleEditor();
      closeTagModal();
    }

    function addNewTag() {
      const input = document.getElementById('new-tag-input');
      const val = input.value.trim().replace(/^#/, '');
      if (val) {
        if (!customTags.includes(val)) customTags.push(val);
        selectTag(val);
        input.value = '';
      }
    }

    // --- Supabase / LocalStorage 永続化 ---
    async function fetchAllFromSupabase() {
      if (supabaseClient) {
        const { data } = await supabaseClient.from('portal_config').select('*').eq('id', 'main_config').single();
        if (data && data.content) {
          const c = data.content;
          portalData = c.portalData || portalData;
          scheduleData = c.scheduleData || scheduleData;
          eventsData = c.eventsData || eventsData;
          submissionsData = c.submissionsData || submissionsData;
          linksData = c.linksData || linksData;
          customTags = c.customTags || customTags;
          holidaySong = c.holidaySong || holidaySong;
          omikujiList = c.omikujiList || omikujiList;
          selectedImageBase64 = c.selectedImageBase64 || '';
          selectedBannerBase64 = c.selectedBannerBase64 || '';
        }
      } else {
        const local = localStorage.getItem('portal_full_data');
        if (local) {
          const c = JSON.parse(local);
          portalData = c.portalData || portalData;
          scheduleData = c.scheduleData || scheduleData;
          eventsData = c.eventsData || eventsData;
          submissionsData = c.submissionsData || submissionsData;
          linksData = c.linksData || linksData;
          customTags = c.customTags || customTags;
          holidaySong = c.holidaySong || holidaySong;
          omikujiList = c.omikujiList || omikujiList;
          selectedImageBase64 = c.selectedImageBase64 || '';
          selectedBannerBase64 = c.selectedBannerBase64 || '';
        }
      }
      applyStylesAndText();
      renderHomeSchedule();
      renderHomeSubmissions();
      renderHomeLinks();
    }

    async function saveAllToSupabase() {
      const payload = {
        portalData, scheduleData, eventsData, submissionsData, linksData, customTags, holidaySong, omikujiList, selectedImageBase64, selectedBannerBase64
      };
      if (supabaseClient) {
        await supabaseClient.from('portal_config').upsert({ id: 'main_config', content: payload });
      }
      localStorage.setItem('portal_full_data', JSON.stringify(payload));
    }

    // --- アプリ起動初期化 ---
    fetchWeather();
    fetchAllFromSupabase();
  </script>
</body>
</html>
