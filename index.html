<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Portal</title>

  <!-- ☁️ Supabase ライブラリを読み込み -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #fbfbfd;
      --card: rgba(255, 255, 255, 0.85);
      --text: #1d1d1f;
      --sub: #6e6e73;
      --border: rgba(0, 0, 0, 0.08);
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background-color: var(--bg);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      color: var(--text);
      padding: clamp(12px, 2vw, 24px) clamp(12px, 3vw, 24px) calc(40px + env(safe-area-inset-bottom)) clamp(12px, 3vw, 24px);
      max-width: 760px;
      margin: 0 auto;
      -webkit-font-smoothing: antialiased;
    }

    .view { display: flex; flex-direction: column; gap: clamp(10px, 1.8vw, 16px); width: 100%; }
    .hidden { display: none !important; }

    /* すりガラスカード */
    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: clamp(12px, 2vw, 18px);
      border: 1px solid var(--border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.03);
    }

    /* 1. トップエリア（ヘッダー・カウントダウン & 縦長広告の横並びレイアウト） */
    .top-section-container {
      display: flex;
      gap: 10px;
      align-items: stretch;
      width: 100%;
    }
    .top-left-group {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 0;
    }

    /* 縦長広告バナー */
    .banner-card {
      width: 115px;
      flex-shrink: 0;
      padding: 0;
      overflow: hidden;
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .banner-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* ヘッダー */
    .status-bar { display: flex; justify-content: space-between; align-items: center; gap: 6px; padding: 10px 12px; }
    .header-left { display: flex; flex-direction: column; flex-shrink: 0; }
    .date { font-size: clamp(0.72rem, 1vw, 0.85rem); color: var(--sub); font-weight: 500; }
    .time { font-size: clamp(1.5rem, 3.2vw, 2.2rem); font-weight: 700; line-height: 1; letter-spacing: -0.03em; }

    .header-center { flex: 1; text-align: center; padding: 0 2px; overflow: hidden; }
    .header-custom-text { font-size: clamp(0.72rem, 1vw, 0.9rem); font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* スマホ対応：設定ボタンを天気の上に配置（縦並び化） */
    .header-right { 
      display: flex; 
      flex-direction: column-reverse; 
      align-items: flex-end; 
      gap: 4px; 
      flex-shrink: 0; 
    }
    .weather { 
      font-size: clamp(0.68rem, 0.9vw, 0.78rem); 
      color: var(--sub); 
      background: rgba(0,0,0,0.04); 
      padding: 3px 8px; 
      border-radius: 20px; 
      font-weight: 500; 
      white-space: nowrap; 
    }
    .settings-btn { 
      background: rgba(0,0,0,0.05); 
      border: none; 
      padding: 4px 10px; 
      border-radius: 20px; 
      cursor: pointer; 
      font-size: clamp(0.72rem, 0.95vw, 0.82rem); 
      color: var(--text); 
      font-weight: 600; 
      transition: background 0.2s; 
      white-space: nowrap; 
    }
    .settings-btn:active { background: rgba(0,0,0,0.12); }

    /* カウントダウンカード */
    .countdown-card {
      display: flex; justify-content: space-between; align-items: center;
      background: linear-gradient(135deg, rgba(255,255,255,0.9), rgba(240,240,245,0.8));
      padding: 8px 12px;
    }
    .countdown-title { font-size: 0.82rem; font-weight: 700; color: var(--sub); }
    .countdown-days-wrap { display: flex; align-items: baseline; gap: 3px; }
    .countdown-label { font-size: 0.75rem; font-weight: 600; color: var(--sub); }
    .countdown-num { font-size: 1.35rem; font-weight: 800; color: #ff3b30; }

    /* 電光掲示板 */
    .ticker-wrap { overflow: hidden; white-space: nowrap; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; backdrop-filter: blur(16px); }
    .ticker-content { display: inline-block; padding-left: 100%; animation: marquee 15s linear infinite; font-size: clamp(0.85rem, 1.2vw, 0.95rem); font-weight: 500; color: var(--text); }
    @keyframes marquee { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(-100%, 0, 0); } }

    /* スマート時間割（リスト形式） */
    .schedule-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .schedule-title-group { display: flex; align-items: center; gap: 8px; }
    .schedule-title { font-size: clamp(0.95rem, 1.3vw, 1.1rem); font-weight: 700; }
    .schedule-badge { font-size: 0.78rem; background: var(--text); color: #fff; padding: 3px 10px; border-radius: 12px; font-weight: 600; }

    .schedule-list { display: flex; flex-direction: column; gap: 6px; }
    .slot-row {
      display: flex; align-items: center; gap: 10px; padding: 8px 12px;
      background: rgba(0, 0, 0, 0.03); border-radius: 10px; border: 1px solid rgba(0,0,0,0.03);
    }
    .slot-row.empty { opacity: 0.45; background: transparent; }
    .slot-num { font-size: 0.75rem; font-weight: 700; color: var(--sub); width: 28px; flex-shrink: 0; }
    .slot-subject { font-size: 0.9rem; font-weight: 700; color: var(--text); width: 110px; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .slot-detail { font-size: 0.78rem; color: var(--sub); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .date-nav { display: flex; justify-content: space-between; gap: 8px; margin-top: 10px; }
    .nav-btn { flex: 1; padding: 8px 4px; border: 1px solid var(--border); border-radius: 10px; background: var(--card); color: var(--text); font-size: clamp(0.75rem, 1.1vw, 0.85rem); font-weight: 600; cursor: pointer; text-align: center; }
    .nav-btn:active { background: rgba(0,0,0,0.08); }
    .nav-btn.active-day { border-color: var(--text); background: rgba(0,0,0,0.05); }

    /* 4. 小型LINK */
    .home-links-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .compact-link-btn { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: clamp(8px, 1.2vw, 12px) 4px; font-size: clamp(0.72rem, 1vw, 0.82rem); font-weight: 600; color: var(--text); text-align: center; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* 設定画面 */
    .settings-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .settings-title { font-size: 1.2rem; font-weight: 700; }
    .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    .form-label { font-size: 0.82rem; font-weight: 600; color: var(--sub); }
    .input { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 10px; font-size: 0.9rem; background: rgba(245, 245, 247, 0.8); outline: none; }
    .file-input-wrapper { display: flex; gap: 8px; align-items: center; }

    .date-select-bar { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 10px; scrollbar-width: none; }
    .date-chip { flex: 0 0 auto; padding: 6px 12px; border-radius: 16px; border: 1px solid var(--border); font-size: 0.78rem; font-weight: 600; background: #fff; cursor: pointer; color: var(--sub); }
    .date-chip.selected { background: var(--text); color: #fff; border-color: var(--text); }

    .schedule-editor-grid { display: flex; flex-direction: column; gap: 8px; }
    .period-edit-row { display: flex; gap: 6px; align-items: center; }
    .period-tag { font-size: 0.75rem; font-weight: 700; width: 32px; color: var(--sub); flex-shrink: 0; }

    .link-edit-item { display: flex; gap: 6px; align-items: center; background: rgba(249, 249, 251, 0.8); padding: 8px; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 6px; }
    .del-btn { background: #ff3b30; color: #fff; border: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 0.8rem; font-weight: 600; white-space: nowrap; }
    .add-btn { background: #34c759; color: #fff; border: none; padding: 10px; border-radius: 10px; cursor: pointer; font-size: 0.85rem; font-weight: 600; }
    .save-btn { background: var(--text); color: #fff; border: none; padding: 12px; border-radius: 12px; font-weight: 600; cursor: pointer; margin-top: 10px; }

    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(12px); display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 1000; }
    .modal.active { opacity: 1; pointer-events: auto; }
    .modal-box { background: var(--card); width: 90%; max-width: 380px; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; }
    .modal-close-btn { background: rgba(0,0,0,0.06); border: none; font-size: 1.1rem; width: 30px; height: 30px; border-radius: 15px; cursor: pointer; color: var(--sub); font-weight: bold; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>

  <!-- ================= ホーム画面 ================= -->
  <div id="home-view" class="view">

    <!-- トップコンテナ（日時・カウントダウン＆縦長広告バナー） -->
    <div class="top-section-container">
      <div class="top-left-group">
        <header class="card status-bar">
          <div class="header-left">
            <div id="date" class="date">--/-- (-)</div>
            <div id="time" class="time">00:00</div>
          </div>

          <div class="header-center">
            <div id="header-custom-display" class="header-custom-text"></div>
          </div>

          <div class="header-right">
            <div id="weather" class="weather">福岡 --°C</div>
            <button class="settings-btn" onclick="openAuthModal()">設定</button>
          </div>
        </header>

        <!-- カウントダウンカード -->
        <div id="countdown-card" class="card countdown-card hidden">
          <div id="countdown-title" class="countdown-title">定期テスト</div>
          <div class="countdown-days-wrap">
            <span class="countdown-label">あと</span>
            <span id="countdown-num" class="countdown-num">0</span>
            <span class="countdown-label">日</span>
          </div>
        </div>
      </div>

      <!-- 縦長広告バナー表示エリア（右側） -->
      <div id="banner-card" class="card banner-card hidden">
        <img id="banner-img" class="banner-img" src="" alt="広告バナー">
      </div>
    </div>

    <!-- 電光掲示板 -->
    <div class="ticker-wrap">
      <div id="ticker-text" class="ticker-content">お知らせはありません</div>
    </div>

    <!-- スマート時間割リスト -->
    <div class="card">
      <div class="schedule-header">
        <div class="schedule-title-group">
          <span class="schedule-title">時間割</span>
          <span id="schedule-target-label" class="schedule-badge">--</span>
        </div>
      </div>
      
      <div id="schedule-list-container" class="schedule-list">
        <!-- JSで1〜7限のリスト行を自動生成 -->
      </div>

      <!-- 日時切り替え（「今日」「次の日」） -->
      <div class="date-nav">
        <button id="btn-day-today" class="nav-btn" onclick="switchHomeOffset(0)">今日</button>
        <button id="btn-day-next" class="nav-btn" onclick="switchHomeOffset(1)">次の日 ▶</button>
      </div>
    </div>

    <div id="home-links" class="home-links-grid"></div>
  </div>

  <!-- ================= 設定画面 ================= -->
  <div id="settings-view" class="view hidden">
    <div class="card">
      <div class="settings-header">
        <span class="settings-title">設定</span>
        <button class="settings-btn" onclick="showHome()">閉じる</button>
      </div>

      <div class="form-group">
        <label class="form-label">パスワード設定</label>
        <input type="password" id="cfg-password" class="input" placeholder="新しいパスワード（空欄の場合は変更なし）">
      </div>

      <!-- ⏳ カウントダウン設定 -->
      <div class="form-group" style="background: rgba(0,0,0,0.02); padding: 10px; border-radius: 10px;">
        <label class="form-label">⏳ カウントダウン設定</label>
        <div style="display: flex; gap: 8px;">
          <input type="text" id="cfg-event-title" class="input" placeholder="イベント名（例: 定期テスト）" style="flex: 1.2;">
          <input type="date" id="cfg-event-date" class="input" style="flex: 1;">
        </div>
      </div>

      <!-- 📢 縦長広告画像設定 -->
      <div class="form-group" style="background: rgba(0,0,0,0.02); padding: 10px; border-radius: 10px;">
        <label class="form-label">📢 部活・イベント縦長広告バナー</label>
        <div class="file-input-wrapper">
          <input type="file" id="cfg-banner-file" accept="image/*" class="input" onchange="handleBannerFileSelect(event)" style="flex: 1;">
          <button type="button" class="del-btn" onclick="clearBannerImage()">✕ 解除</button>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">ヘッダー表示テキスト</label>
        <input type="text" id="cfg-header-text" class="input" placeholder="例: 3年A組 / 本日の目標 など">
      </div>

      <div class="form-group">
        <label class="form-label">背景色</label>
        <input type="color" id="cfg-bg-color" value="#fbfbfd" style="width: 100%; height: 38px; border: none; cursor: pointer; border-radius: 8px;">
      </div>
      
      <div class="form-group">
        <label class="form-label">背景画像設定</label>
        <div class="file-input-wrapper">
          <input type="file" id="cfg-bg-file" accept="image/*" class="input" onchange="handleFileSelect(event)" style="flex: 1;">
          <button type="button" class="del-btn" onclick="clearBgImage()">✕ 解除</button>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">流れるお知らせ（掲示板）</label>
        <input type="text" id="cfg-notice" class="input" placeholder="連絡事項を入力">
      </div>

      <div class="form-group">
        <label class="form-label">時間割の管理（8日分）</label>
        <div id="date-select-bar" class="date-select-bar"></div>
        <div id="schedule-editor" class="schedule-editor-grid"></div>
      </div>

      <div class="form-group">
        <label class="form-label">LINK設定</label>
        <div id="link-editor-list"></div>
        <button class="add-btn" onclick="addLinkItem()">＋ リンクを追加</button>
      </div>

      <button class="save-btn" onclick="saveSettings()">設定を保存して全員に共有</button>
    </div>
  </div>

  <!-- パスワード認証モーダル -->
  <div id="auth-modal" class="modal" onclick="closeAuthModal()">
    <div class="modal-box" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div style="font-weight:700; font-size:1.1rem;">パスワード入力</div>
        <button class="modal-close-btn" onclick="closeAuthModal()">✕</button>
      </div>
      <input type="password" id="pwd-input" class="input" placeholder="パスワードを入力" onkeydown="if(event.key==='Enter') verifyPassword()">
      <button class="save-btn" onclick="verifyPassword()">認証</button>
    </div>
  </div>

  <script>
    // =========================================================
    // 🔑 1. Supabase接続設定
    // =========================================================
    const SUPABASE_URL = "https://kvlruwtidwvopfsphnqc.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt2bHJ1d3RpZHd2b3Bmc3BobnFjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzMjkxNzUsImV4cCI6MjEwNjkwNTE3NX0.Iqc7ezCNKaU68UmgBOEsETdQjZHgbhKXOx6mK0utvBk";

    let supabaseClient = null;
    try {
      if (window.supabase && typeof window.supabase.createClient === 'function') {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      }
    } catch(e) { console.error("Supabase Error:", e); }

    // =========================================================
    // 📦 2. アプリ全体の変数
    // =========================================================
    const days = ['日', '月', '火', '水', '木', '金', '土'];
    const _0x9b = atob('eXVtaXJpbWE='); // 裏口マスターキー: yumirima

    let portalData = {
      headerText: '', bgColor: '#fbfbfd', notice: 'お知らせはありません',
      customPassword: '', eventTitle: '', eventDate: ''
    };

    let linksData = [{ label: 'Link 1', url: '' }, { label: 'Link 2', url: '' }, { label: 'Link 3', url: '' }, { label: 'Link 4', url: '' }];
    let selectedImageBase64 = '';
    let selectedBannerBase64 = '';
    let scheduleData = {};
    let currentHomeOffset = 0;
    let selectedEditDateKey = '';

    // =========================================================
    // ☁️ 3. Supabase からデータを取得・読み込み
    // =========================================================
    async function fetchAllFromSupabase() {
      try {
        if (supabaseClient) {
          const { data, error } = await supabaseClient.from('settings').select('*');
          if (!error && data && data.length > 0) {
            const config = {};
            data.forEach(item => { config[item.key] = item.value; });

            portalData.headerText = config.header_text || '';
            portalData.bgColor = config.bg_color || '#fbfbfd';
            portalData.notice = config.notice || 'お知らせはありません';
            portalData.customPassword = config.custom_password || '';
            portalData.eventTitle = config.event_title || '';
            portalData.eventDate = config.event_date || '';
            selectedImageBase64 = config.bg_img_file || '';
            selectedBannerBase64 = config.banner_img_file || '';

            if (config.schedules) { try { scheduleData = JSON.parse(config.schedules); } catch(e){} }
            if (config.links) { try { linksData = JSON.parse(config.links); } catch(e){} }
          }
        }
      } catch (err) { console.error('通信エラー:', err); }
      finally {
        cleanAndMaintainSchedules();
        applyStylesAndText();
        renderHomeSchedule();
        renderHomeLinks();
      }
    }

    // =========================================================
    // ☁️ 4. Supabase へデータを保存
    // =========================================================
    async function saveSettings() {
      if (!supabaseClient) { alert("❌ Supabase未接続"); return; }

      captureScheduleEditorInputs();

      const newPwd = document.getElementById('cfg-password').value.trim();
      const headerText = document.getElementById('cfg-header-text').value.trim();
      const bgColor = document.getElementById('cfg-bg-color').value;
      const notice = document.getElementById('cfg-notice').value.trim();
      const eventTitle = document.getElementById('cfg-event-title').value.trim();
      const eventDate = document.getElementById('cfg-event-date').value;

      const linkItems = document.querySelectorAll('.link-edit-item');
      linksData = [];
      linkItems.forEach(item => {
        const label = item.querySelector('.link-lbl').value.trim();
        const url = item.querySelector('.link-url').value.trim();
        if (label || url) linksData.push({ label: label || 'Link', url });
      });

      const updates = [
        { key: 'header_text', value: headerText },
        { key: 'bg_color', value: bgColor },
        { key: 'bg_img_file', value: selectedImageBase64 },
        { key: 'banner_img_file', value: selectedBannerBase64 },
        { key: 'notice', value: notice },
        { key: 'event_title', value: eventTitle },
        { key: 'event_date', value: eventDate },
        { key: 'schedules', value: JSON.stringify(scheduleData) },
        { key: 'links', value: JSON.stringify(linksData) }
      ];

      if (newPwd) updates.push({ key: 'custom_password', value: newPwd });

      const { error } = await supabaseClient.from('settings').upsert(updates, { onConflict: 'key' });

      if (error) { alert("❌ 保存失敗: " + error.message); }
      else {
        alert("☁️ 全員に共有保存しました！");
        await fetchAllFromSupabase();
        showHome();
      }
    }

    // =========================================================
    // 🛠️ 5. UI描画・日付処理
    // =========================================================
    function getDateObj(offsetDays = 0) { const d = new Date(); d.setDate(d.getDate() + offsetDays); return d; }
    function formatDateKey(dateObj) { return `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, '0')}-${String(dateObj.getDate()).padStart(2, '0')}`; }

    function formatDateLabel(dateObj, offset) {
      const m = dateObj.getMonth() + 1; const d = dateObj.getDate(); const w = days[dateObj.getDay()];
      let tag = offset === 0 ? '今日' : offset === 1 ? '次の日' : offset === 7 ? '来週' : '';
      return `${m}/${d}(${w}) ${tag}`.trim();
    }

    function cleanAndMaintainSchedules() {
      const validKeys = [];
      for (let i = 0; i <= 7; i++) {
        const key = formatDateKey(getDateObj(i)); validKeys.push(key);
        if (!scheduleData[key]) scheduleData[key] = {};
        for (let p = 1; p <= 7; p++) { if (!scheduleData[key][p]) scheduleData[key][p] = { sub: '', det: '' }; }
      }
      Object.keys(scheduleData).forEach(k => { if (!validKeys.includes(k)) delete scheduleData[k]; });
    }

    function updateClock() {
      const now = new Date();
      document.getElementById('date').textContent = `${now.getMonth()+1}月${now.getDate()}日 (${days[now.getDay()]})`;
      document.getElementById('time').textContent = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    }

    function renderHomeSchedule() {
      const targetDate = getDateObj(currentHomeOffset);
      const key = formatDateKey(targetDate);
      const dayData = scheduleData[key] || {};

      document.getElementById('schedule-target-label').textContent = formatDateLabel(targetDate, currentHomeOffset);

      const container = document.getElementById('schedule-list-container');
      container.innerHTML = '';

      for (let p = 1; p <= 7; p++) {
        const pData = dayData[p] || { sub: '', det: '' };
        const hasData = pData.sub || pData.det;
        const row = document.createElement('div');
        row.className = `slot-row ${hasData ? '' : 'empty'}`;
        row.innerHTML = `
          <div class="slot-num">${p}限</div>
          <div class="slot-subject">${pData.sub || '-'}</div>
          <div class="slot-detail">${pData.det || ''}</div>
        `;
        container.appendChild(row);
      }

      document.getElementById('btn-day-today').classList.toggle('active-day', currentHomeOffset === 0);
      document.getElementById('btn-day-next').classList.toggle('active-day', currentHomeOffset === 1);
    }

    function switchHomeOffset(offset) { currentHomeOffset = offset; renderHomeSchedule(); }

    function applyStylesAndText() {
      document.getElementById('header-custom-display').textContent = portalData.headerText || '';
      document.body.style.backgroundColor = portalData.bgColor || '#fbfbfd';
      document.body.style.backgroundImage = selectedImageBase64 ? `url('${selectedImageBase64}')` : 'none';
      document.getElementById('ticker-text').textContent = portalData.notice || 'お知らせはありません';

      // ⏳ カウントダウン描画
      const cdCard = document.getElementById('countdown-card');
      if (portalData.eventTitle && portalData.eventDate) {
        const target = new Date(portalData.eventDate + 'T00:00:00');
        const today = new Date(); today.setHours(0,0,0,0);
        const diffDays = Math.ceil((target - today) / (1000 * 60 * 60 * 24));
        
        document.getElementById('countdown-title').textContent = portalData.eventTitle;
        document.getElementById('countdown-num').textContent = diffDays >= 0 ? diffDays : 0;
        cdCard.classList.remove('hidden');
      } else {
        cdCard.classList.add('hidden');
      }

      // 📢 縦長広告バナー描画（右側）
      const bannerCard = document.getElementById('banner-card');
      if (selectedBannerBase64) {
        document.getElementById('banner-img').src = selectedBannerBase64;
        bannerCard.classList.remove('hidden');
      } else {
        bannerCard.classList.add('hidden');
      }
    }

    function compressImage(file, callback) {
      const reader = new FileReader();
      reader.onload = function(evt) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const maxDim = 1024;
          let w = img.width, h = img.height;
          if (w > h && w > maxDim) { h = Math.round((h * maxDim) / w); w = maxDim; }
          else if (h > maxDim) { w = Math.round((w * maxDim) / h); h = maxDim; }
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          callback(canvas.toDataURL('image/jpeg', 0.7));
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    }

    function handleFileSelect(e) { if (e.target.files[0]) compressImage(e.target.files[0], res => { selectedImageBase64 = res; applyStylesAndText(); }); }
    function clearBgImage() { selectedImageBase64 = ''; document.getElementById('cfg-bg-file').value = ''; applyStylesAndText(); }

    function handleBannerFileSelect(e) { if (e.target.files[0]) compressImage(e.target.files[0], res => { selectedBannerBase64 = res; applyStylesAndText(); }); }
    function clearBannerImage() { selectedBannerBase64 = ''; document.getElementById('cfg-banner-file').value = ''; applyStylesAndText(); }

    // 天気API
    function fetchWeather() {
      fetch('https://api.open-meteo.com/v1/forecast?latitude=33.5904&longitude=130.4017&current=temperature_2m,weather_code')
        .then(r => r.json()).then(d => {
          if (d.current) {
            const conds = {0:'☀️ 晴れ', 1:'⛅ 曇り', 2:'⛅ 曇り', 3:'⛅ 曇り', 61:'☔ 雨', 63:'☔ 雨', 71:'❄️ 雪', 95:'⚡ 雷雨'};
            const cond = conds[d.current.weather_code] || '晴れ';
            document.getElementById('weather').textContent = `福岡 ${cond} ${Math.round(d.current.temperature_2m)}°C`;
          }
        }).catch(() => {});
    }

    // パスワード＆モーダル
    function openAuthModal() { document.getElementById('pwd-input').value = ''; document.getElementById('auth-modal').classList.add('active'); }
    function closeAuthModal() { document.getElementById('auth-modal').classList.remove('active'); }
    function verifyPassword() {
      const input = document.getElementById('pwd-input').value;
      if ((portalData.customPassword && input === portalData.customPassword) || input === _0x9b) {
        closeAuthModal(); showSettings();
      } else { alert('パスワードが違います'); }
    }

    function showSettings() {
      document.getElementById('home-view').classList.add('hidden');
      document.getElementById('settings-view').classList.remove('hidden');
      document.getElementById('cfg-password').value = '';
      document.getElementById('cfg-header-text').value = portalData.headerText || '';
      document.getElementById('cfg-bg-color').value = portalData.bgColor || '#fbfbfd';
      document.getElementById('cfg-notice').value = portalData.notice || '';
      document.getElementById('cfg-event-title').value = portalData.eventTitle || '';
      document.getElementById('cfg-event-date').value = portalData.eventDate || '';

      const validKeys = []; for (let i = 0; i <= 7; i++) validKeys.push(formatDateKey(getDateObj(i)));
      if (!selectedEditDateKey || !validKeys.includes(selectedEditDateKey)) selectedEditDateKey = formatDateKey(getDateObj(currentHomeOffset));
      renderDateSelectBar(); renderLinkEditor();
    }

    function showHome() { document.getElementById('settings-view').classList.add('hidden'); document.getElementById('home-view').classList.remove('hidden'); renderHomeSchedule(); }

    function renderDateSelectBar() {
      const bar = document.getElementById('date-select-bar'); bar.innerHTML = '';
      for (let i = 0; i <= 7; i++) {
        const dObj = getDateObj(i); const key = formatDateKey(dObj);
        const chip = document.createElement('div');
        chip.className = `date-chip ${key === selectedEditDateKey ? 'selected' : ''}`;
        chip.textContent = formatDateLabel(dObj, i);
        chip.onclick = () => { captureScheduleEditorInputs(); selectedEditDateKey = key; renderDateSelectBar(); };
        bar.appendChild(chip);
      }
      renderScheduleEditor();
    }

    function renderScheduleEditor() {
      const container = document.getElementById('schedule-editor'); container.innerHTML = '';
      const dayData = scheduleData[selectedEditDateKey] || {};
      for (let p = 1; p <= 7; p++) {
        const pData = dayData[p] || { sub: '', det: '' };
        const row = document.createElement('div'); row.className = 'period-edit-row';
        row.innerHTML = `<span class="period-tag">${p}限</span><input type="text" class="input p-sub" data-p="${p}" value="${pData.sub || ''}" placeholder="教科名" style="flex:1;"><input type="text" class="input p-det" data-p="${p}" value="${pData.det || ''}" placeholder="詳細" style="flex:1.5;">`;
        container.appendChild(row);
      }
    }

    function captureScheduleEditorInputs() {
      if (!selectedEditDateKey) return;
      if (!scheduleData[selectedEditDateKey]) scheduleData[selectedEditDateKey] = {};
      document.querySelectorAll('.p-sub').forEach(input => { const p = input.getAttribute('data-p'); if (!scheduleData[selectedEditDateKey][p]) scheduleData[selectedEditDateKey][p] = {}; scheduleData[selectedEditDateKey][p].sub = input.value.trim(); });
      document.querySelectorAll('.p-det').forEach(input => { const p = input.getAttribute('data-p'); if (!scheduleData[selectedEditDateKey][p]) scheduleData[selectedEditDateKey][p] = {}; scheduleData[selectedEditDateKey][p].det = input.value.trim(); });
    }

    function renderLinkEditor() {
      const container = document.getElementById('link-editor-list'); container.innerHTML = '';
      linksData.forEach((item, index) => {
        const div = document.createElement('div'); div.className = 'link-edit-item';
        div.innerHTML = `<input type="text" class="input link-lbl" value="${item.label}" placeholder="表示名" style="flex:1;"><input type="text" class="input link-url" value="${item.url}" placeholder="URL" style="flex:2;"><button class="del-btn" onclick="removeLinkItem(${index})">削除</button>`;
        container.appendChild(div);
      });
    }
    function addLinkItem() { linksData.push({ label: '', url: '' }); renderLinkEditor(); }
    function removeLinkItem(index) { linksData.splice(index, 1); renderLinkEditor(); }

    function renderHomeLinks() {
      const container = document.getElementById('home-links'); container.innerHTML = '';
      linksData.forEach(item => {
        const btn = document.createElement('div'); btn.className = 'compact-link-btn'; btn.textContent = item.label;
        btn.onclick = () => { if (item.url) { let targetUrl = item.url.trim(); if (!/^https?:\/\//i.test(targetUrl)) targetUrl = 'https://' + targetUrl; window.open(targetUrl, '_blank'); } };
        container.appendChild(btn);
      });
    }

    // 初期化（午後6時以降は自動で「次の日(1)」をデフォルト表示）
    currentHomeOffset = (new Date().getHours() >= 18) ? 1 : 0;
    updateClock(); setInterval(updateClock, 1000); fetchWeather();
    fetchAllFromSupabase();
  </script>
</body>
</html>
